services:
  postgres:
    image: postgres:16
    container_name: skillbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillbridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - skillbridge_pg_data:/var/lib/postgresql/data

volumes:
  skillbridge_pg_data:
